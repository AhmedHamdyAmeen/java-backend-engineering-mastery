# Java Backend Engineering Mastery — module catalog (source of truth)
#
# - List order = teaching order. IDs are stable and never reused (see CONVENTIONS.md).
# - `n` is the module's number in the original 1–298 roadmap (null for modules added later).
# - `prereqs` must refer to modules earlier in teaching order; `co_requisites` are taught in parallel.
# - After editing, run `py tools/build.py`.

version: "2.0"

levels:
  - code: BEG
    order: 1
    name: Beginner — Foundations
    dir: 01-beginner
    audience: Someone with no programming, computer science, or IT background.
    outcome: >-
      Writes Java console applications, solves basic programming problems, uses Git,
      understands relational databases, and explains how a web application works.
    study_hours: "180–250"
    video_hours: "40–55"
    lessons: "140–190"
    capstone:
      id: BEG-CAP
      title: Library Management System
      summary: Java console application using OOP, collections, file handling, and PostgreSQL via JDBC.
    gate: >-
      Explain the program's architecture, demonstrate debugging, write SQL queries,
      and extend the application with a new requirement.
    phases:
      - {id: BEG-P1, title: Introduction to Computers and Software Engineering, file: P1-computers-and-software.md}
      - {id: BEG-P2, title: Programming Fundamentals with Java, file: P2-programming-fundamentals.md}
      - {id: BEG-P3, title: Object-Oriented Programming, file: P3-object-oriented-programming.md}
      - {id: BEG-P4, title: Essential Core Java, file: P4-essential-core-java.md}
      - {id: BEG-P5, title: Computer Science Foundations, file: P5-computer-science-foundations.md}
      - {id: BEG-P6, title: "Git, SQL, and Web Foundations", file: P6-git-sql-web.md}

  - code: JNR
    order: 2
    name: Junior Java Backend Engineer
    dir: 02-junior
    audience: Graduates of Level 1 or self-taught programmers who pass the Level 2 diagnostic.
    outcome: >-
      Implements, tests, secures, and deploys a maintainable backend application within an existing
      architecture, collaborates using Git, and handles straightforward production defects with guidance.
    study_hours: "250–350"
    video_hours: "50–70"
    lessons: "160–210"
    capstone:
      id: JNR-CAP
      title: E-Commerce Backend API
      summary: >-
        Modular layered monolith with registration, login, catalog, inventory, cart, orders, mock payments,
        administration; OpenAPI, migrations, tests, Docker Compose, CI, deployment, structured logs.
    gate: >-
      Given a feature request, implements it independently within the established architecture, writes
      meaningful tests, explains the database changes, and delivers a reviewable pull request.
    phases:
      - {id: JNR-P1, title: Professional Java Development, file: P1-professional-java.md}
      - {id: JNR-P2, title: Spring Framework Fundamentals, file: P2-spring-fundamentals.md}
      - {id: JNR-P3, title: REST API Engineering, file: P3-rest-api-engineering.md}
      - {id: JNR-P4, title: Database Integration, file: P4-database-integration.md}
      - {id: JNR-P5, title: Authentication and Application Security, file: P5-security.md}
      - {id: JNR-P6, title: Testing and Delivery, file: P6-testing-and-delivery.md}

  - code: MID
    order: 3
    name: Mid-Level Java Backend Engineer
    dir: 03-mid
    audience: Working junior engineers or Level 2 graduates.
    outcome: >-
      Designs and owns moderately complex services, troubleshoots production issues, reasons about
      performance and reliability, and makes informed technical trade-offs.
    study_hours: "300–450"
    video_hours: "60–85"
    lessons: "180–250"
    capstone:
      id: MID-CAP
      title: Distributed Order Processing Platform
      summary: >-
        Independently deployable services split along domain boundaries: order saga, transactional outbox,
        idempotent consumers, inventory reservation, Redis caching, tracing, DLQs, load tests, recovery runbooks.
    gate: >-
      Diagnoses a simulated production incident, improves a measured performance bottleneck,
      and defends the architecture's trade-offs.
    phases:
      - {id: MID-P1, title: Advanced Java and JVM Internals, file: P1-jvm-and-concurrency.md}
      - {id: MID-P2, title: Advanced PostgreSQL and Data Access, file: P2-advanced-postgresql.md}
      - {id: MID-P3, title: Distributed Systems Foundations, file: P3-distributed-systems.md}
      - {id: MID-P4, title: Caching and Nonrelational Data, file: P4-caching-and-nosql.md}
      - {id: MID-P5, title: Production Engineering and Security, file: P5-production-engineering.md}
      - {id: MID-P6, title: API Evolution and Professional Ownership, file: P6-api-evolution-and-ownership.md}

  - code: SRC
    order: 4
    name: Senior Backend Engineer — Grade C (System ownership)
    dir: 04-senior-c
    audience: Mid-level engineers with production experience.
    outcome: >-
      Independently leads the design and delivery of a significant subsystem, makes reliable architecture
      decisions, manages technical risks, and guides less-experienced engineers.
    study_hours: "150–220 plus substantial real-world practice"
    video_hours: "25–35"
    lessons: "65–90"
    capstone:
      id: SRC-CAP
      title: Reliability and Performance Redesign
      summary: >-
        Own the order-processing subsystem and redesign it to meet explicit availability, latency, and recovery
        targets, with architecture docs, performance evidence, failure-injection tests, and an operational handover.
    gate: Scenario-based design review and production-incident simulation.
    phases:
      - {id: SRC-P1, title: System Design and Architecture Decisions, file: P1-system-design-and-decisions.md}
      - {id: SRC-P2, title: Reliability and Technical Ownership, file: P2-reliability-and-ownership.md}

  - code: SRB
    order: 5
    name: Senior Backend Engineer — Grade B (Cross-team design)
    dir: 05-senior-b
    audience: Senior engineers owning a subsystem.
    outcome: >-
      Leads complex multi-team technical initiatives, evolves existing architectures safely, and balances
      delivery speed, cost, and long-term maintainability.
    study_hours: "160–240 plus cross-team delivery experience"
    video_hours: "25–40"
    lessons: "65–95"
    capstone:
      id: SRB-CAP
      title: Architecture Modernization
      summary: >-
        Design and lead a simulated migration from a modular monolith to selected services, with phased releases,
        compatibility guarantees, observability, rollback plans, and measurable outcomes.
    gate: Scenario-based migration review with stakeholder negotiation.
    phases:
      - {id: SRB-P1, title: Advanced Distributed Architecture, file: P1-advanced-distributed-architecture.md}
      - {id: SRB-P2, title: Engineering Leadership and Delivery, file: P2-leadership-and-delivery.md}

  - code: SRA
    order: 6
    name: Senior Backend Engineer — Grade A (Technical leadership)
    dir: 06-senior-a
    audience: Senior engineers leading cross-team work.
    outcome: >-
      Shapes the technical direction of a major product area, resolves difficult architectural problems,
      establishes engineering standards, and influences several teams without formal authority.
    study_hours: "160–240 plus organizational leadership experience"
    video_hours: "25–40"
    lessons: "65–95"
    capstone:
      id: SRA-CAP
      title: Multi-Year Platform Evolution
      summary: >-
        Three-year architecture evolution strategy for a growing commerce platform: capacity assumptions,
        modernization sequencing, security and reliability objectives, cost estimates, and governance.
    gate: Strategy defense before a simulated leadership panel.
    phases:
      - {id: SRA-P1, title: Advanced System Strategy, file: P1-advanced-system-strategy.md}
      - {id: SRA-P2, title: Influence and Organizational Execution, file: P2-influence-and-execution.md}

  - code: STF
    order: 7
    name: Staff Software Engineer
    dir: 07-staff
    audience: Senior engineers moving toward organization-wide scope. Related track, not a mandatory step after SRA.
    outcome: >-
      Identifies systemic technical problems, creates organization-wide leverage, leads strategic engineering
      programs, and improves the effectiveness of multiple teams.
    study_hours: "180–280; role readiness requires demonstrated organizational impact"
    video_hours: "30–45"
    lessons: "70–100"
    capstone:
      id: STF-CAP
      title: Internal Developer Platform
      summary: >-
        Platform for 10–20 hypothetical product teams: architecture, self-service deployment, CI/CD, observability
        and security standards, service templates, adoption roadmap, cost model, governance, success metrics.
    gate: Assessed on organizational leverage, not only code quality.
    phases:
      - {id: STF-P1, title: Staff-Level Technical Strategy, file: P1-staff-technical-strategy.md}
      - {id: STF-P2, title: "Influence, Communication, and Leadership", file: P2-influence-and-leadership.md}

  - code: ARC
    order: 8
    name: Solution Architect
    dir: 08-solution-architect
    audience: Senior engineers moving toward end-to-end solution design. Related track, not a mandatory step after STF.
    outcome: >-
      Designs a complete solution connecting business requirements, applications, integrations, infrastructure,
      security, data, operations, delivery, and cost.
    study_hours: "220–350 with extensive case-study and stakeholder practice"
    video_hours: "40–60"
    lessons: "100–140"
    capstone:
      id: ARC-CAP
      title: Enterprise Digital Commerce Platform
      summary: >-
        Complete solution architecture package for a retailer (web/mobile, inventory, payments, fulfillment,
        customer service, reporting, ERP integration), from requirements to executive presentation.
    gate: >-
      Defend the solution in a simulated architecture review with competing requirements, budget constraints,
      changing priorities, and failure scenarios.
    phases:
      - {id: ARC-P1, title: Business and Enterprise Architecture Foundations, file: P1-business-and-enterprise-architecture.md}
      - {id: ARC-P2, title: Cloud and Infrastructure Architecture, file: P2-cloud-and-infrastructure.md}
      - {id: ARC-P3, title: "Enterprise Data, Integration, and Security", file: P3-data-integration-and-security.md}
      - {id: ARC-P4, title: "Solution Design, Governance, and Delivery", file: P4-solution-design-and-delivery.md}

modules:
  # ── LEVEL 1 — BEGINNER ─────────────────────────────────────────────────────
  # BEG-P1 Introduction to Computers and Software Engineering
  - {id: BEG-001, n: 1, phase: BEG-P1, status: detailed, title: Understanding computers, topics: "What computers do; hardware vs software; CPU, RAM, SSD; storage; input/output; binary and bits; operating systems; processes and applications", prereqs: []}
  - {id: BEG-002, n: 2, phase: BEG-P1, status: detailed, title: Understanding software, topics: "What software is; desktop, mobile, web, backend, embedded; programs vs services; software lifecycle", prereqs: [BEG-001]}
  - {id: BEG-003, n: 3, phase: BEG-P1, status: detailed, title: The internet, topics: "Internet vs web; IP addresses; domains; DNS; browsers; clients and servers; requests and responses; HTTP vs HTTPS", prereqs: [BEG-001]}
  - {id: BEG-004, n: 4, phase: BEG-P1, status: detailed, title: Introduction to engineering, topics: "Developer vs software engineer; frontend vs backend vs full-stack; QA, DevOps, SRE, architect; how teams collaborate", prereqs: [BEG-002]}
  - {id: BEG-005, n: 5, phase: BEG-P1, status: detailed, title: Development environment, topics: "OS basics; installing the JDK; IntelliJ IDEA; VS Code; file extensions; environment variables; PATH", prereqs: [BEG-001]}
  - {id: BEG-006, n: 6, phase: BEG-P1, status: detailed, title: Command line, topics: "Terminal, shell, directories, file commands, paths, permissions, environment variables, pipes, redirection, basic Bash/PowerShell", prereqs: [BEG-005]}
  - {id: BEG-007, n: 7, phase: BEG-P1, status: detailed, title: How code runs, topics: "Source code, compilation, bytecode, execution, runtime errors; Java compiler, JVM, JRE, JDK", prereqs: [BEG-002, BEG-006]}
  # BEG-P2 Programming Fundamentals with Java
  - {id: BEG-008, n: 8, phase: BEG-P2, status: detailed, title: First Java program, topics: "Java syntax, main(), classes, statements, comments, console output", prereqs: [BEG-007]}
  - {id: BEG-009, n: 9, phase: BEG-P2, status: detailed, title: Variables and data types, topics: "Primitives, reference types, variables, literals, constants, naming conventions, type conversion", prereqs: [BEG-008]}
  - {id: BEG-010, n: 10, phase: BEG-P2, status: detailed, title: Operators, topics: "Arithmetic, comparison, logical, assignment, precedence, increment/decrement", prereqs: [BEG-009]}
  - {id: BEG-011, n: 11, phase: BEG-P2, status: detailed, title: Input and output, topics: "Scanner, console input, formatting, parsing, input validation", prereqs: [BEG-010]}
  - {id: BEG-012, n: 12, phase: BEG-P2, status: detailed, title: Conditions, topics: "if, else, else if, switch, switch expressions, nested conditions", prereqs: [BEG-010]}
  - {id: BEG-013, n: 13, phase: BEG-P2, status: detailed, title: Loops, topics: "for, enhanced for, while, do-while, break, continue, nested loops", prereqs: [BEG-012]}
  - {id: BEG-014, n: 14, phase: BEG-P2, status: detailed, title: Methods, topics: "Parameters, return values, signatures, overloading, scope, call stack, recursion basics", prereqs: [BEG-013]}
  - {id: BEG-015, n: 15, phase: BEG-P2, status: detailed, title: Arrays and strings, topics: "One-dimensional/multidimensional arrays, String, StringBuilder, common operations", prereqs: [BEG-013, BEG-014]}
  - {id: BEG-016, n: 16, phase: BEG-P2, status: detailed, title: Problem-solving, topics: "Decomposition, pseudocode, flowcharts, tracing, debugging, edge cases", prereqs: [BEG-015]}
  - {id: BEG-017, n: 17, phase: BEG-P2, status: detailed, title: Introductory algorithms, topics: "Linear search, binary search, bubble sort, selection sort, basic time complexity", prereqs: [BEG-015, BEG-016]}
  - {id: BEG-018, n: 18, phase: BEG-P2, status: detailed, title: Debugging, topics: "Breakpoints, step into/over/out, variable inspection, stack traces, common errors", prereqs: [BEG-014]}
  - {id: BEG-056, n: null, phase: BEG-P2, status: detailed, title: AI coding assistants for learners, topics: "How LLMs work conceptually, tokens and prediction, hallucination, asking good questions, explaining errors, never pasting secrets, try-first learning rules", prereqs: [BEG-016, BEG-018]}  # Added in v2.0: AI
  # BEG-P3 Object-Oriented Programming
  - {id: BEG-019, n: 19, phase: BEG-P3, status: detailed, title: OOP introduction, topics: "Procedural vs object-oriented programming, objects, classes, state, behavior", prereqs: [BEG-014]}
  - {id: BEG-020, n: 20, phase: BEG-P3, status: detailed, title: Classes and objects, topics: "Fields, constructors, methods, this, object creation", prereqs: [BEG-019]}
  - {id: BEG-021, n: 21, phase: BEG-P3, status: detailed, title: Encapsulation, topics: "Access modifiers, getters/setters, invariants, immutability", prereqs: [BEG-020]}
  - {id: BEG-022, n: 22, phase: BEG-P3, status: detailed, title: Inheritance, topics: "extends, superclass/subclass, overriding, super, composition vs inheritance", prereqs: [BEG-021]}
  - {id: BEG-023, n: 23, phase: BEG-P3, status: detailed, title: Polymorphism, topics: "Dynamic dispatch, upcasting, interfaces, abstraction", prereqs: [BEG-022]}
  - {id: BEG-024, n: 24, phase: BEG-P3, status: detailed, title: Abstract classes and interfaces, topics: "Abstract methods, interface contracts, default methods", prereqs: [BEG-023]}
  - {id: BEG-025, n: 25, phase: BEG-P3, status: detailed, title: Relationships, topics: "Association, aggregation, composition, dependency", prereqs: [BEG-020, BEG-022]}
  - {id: BEG-026, n: 26, phase: BEG-P3, status: detailed, title: Java object model, topics: "Object, equals(), hashCode(), toString(), identity vs equality", prereqs: [BEG-022]}
  - {id: BEG-027, n: 27, phase: BEG-P3, status: detailed, title: Packages and organization, topics: "Packages, imports, visibility, cohesive class design", prereqs: [BEG-021]}
  - {id: BEG-028, n: 28, phase: BEG-P3, status: detailed, title: OOP design practice, topics: "Modeling real-world domains, identifying responsibilities, avoiding god classes", prereqs: [BEG-024, BEG-025, BEG-027]}
  # BEG-P4 Essential Core Java
  - {id: BEG-029, n: 29, phase: BEG-P4, status: detailed, title: Exceptions, topics: "Checked vs unchecked, try/catch/finally, throw/throws, custom exceptions, try-with-resources", prereqs: [BEG-022]}
  - {id: BEG-030, n: 30, phase: BEG-P4, status: detailed, title: Collections, topics: "List, Set, Map, Queue, ArrayList, LinkedList, HashSet, HashMap, TreeMap", prereqs: [BEG-024, BEG-026], co_requisites: [BEG-031]}
  - {id: BEG-031, n: 31, phase: BEG-P4, status: detailed, title: Generics, topics: "Generic classes, methods, type parameters, wildcards basics", prereqs: [BEG-030]}
  - {id: BEG-032, n: 32, phase: BEG-P4, status: detailed, title: Sorting and comparison, topics: "Comparable, Comparator, sorting collections", prereqs: [BEG-024, BEG-030]}
  - {id: BEG-033, n: 33, phase: BEG-P4, status: detailed, title: Date and time, topics: "LocalDate, LocalDateTime, Instant, Duration, ZonedDateTime, time zones", prereqs: [BEG-020]}
  - {id: BEG-034, n: 34, phase: BEG-P4, status: detailed, title: Files and I/O, topics: "Paths, Files API, reading/writing text, streams, buffered I/O", prereqs: [BEG-006, BEG-029]}
  - {id: BEG-035, n: 35, phase: BEG-P4, status: detailed, title: Functional basics, topics: "Lambda expressions, functional interfaces, method references", prereqs: [BEG-024]}
  - {id: BEG-036, n: 36, phase: BEG-P4, status: detailed, title: Stream API, topics: "filter, map, flatMap, reduce, collectors, grouping", prereqs: [BEG-030, BEG-035]}
  - {id: BEG-037, n: 37, phase: BEG-P4, status: detailed, title: Optional, topics: "Optional creation, transformations, appropriate usage", prereqs: [BEG-035]}
  - {id: BEG-038, n: 38, phase: BEG-P4, status: detailed, title: Java memory basics, topics: "Stack and heap conceptual model, object references, garbage collection introduction", prereqs: [BEG-014, BEG-020]}
  # BEG-P5 Computer Science Foundations
  - {id: BEG-039, n: 39, phase: BEG-P5, status: detailed, title: Algorithms and complexity, topics: "Big O, time vs space complexity, best/average/worst cases", prereqs: [BEG-017]}
  - {id: BEG-040, n: 40, phase: BEG-P5, status: detailed, title: Linear data structures, topics: "Arrays, dynamic arrays, linked lists, stacks, queues", prereqs: [BEG-031, BEG-039]}
  - {id: BEG-041, n: 41, phase: BEG-P5, status: detailed, title: Hashing, topics: "Hash functions, hash tables, collisions, hash-based collections", prereqs: [BEG-026, BEG-040]}
  - {id: BEG-042, n: 42, phase: BEG-P5, status: detailed, title: Trees, topics: "Binary trees, BST, traversal, heap fundamentals", prereqs: [BEG-014, BEG-040]}
  - {id: BEG-043, n: 43, phase: BEG-P5, status: detailed, title: Graph basics, topics: "Vertices, edges, BFS, DFS, common applications", prereqs: [BEG-030, BEG-042]}
  - {id: BEG-044, n: 44, phase: BEG-P5, status: detailed, title: Algorithmic techniques, topics: "Two pointers, sliding window, recursion, basic backtracking", prereqs: [BEG-015, BEG-039]}
  - {id: BEG-045, n: 45, phase: BEG-P5, status: detailed, title: Testing fundamentals, topics: "What testing is, test cases, assertions, boundary conditions, JUnit introduction", prereqs: [BEG-024, BEG-029]}
  - {id: BEG-057, n: null, phase: BEG-P5, status: detailed, title: Verifying AI-generated code, topics: "Reading and tracing generated code, testing it, plausible-but-wrong code, licensing and academic integrity", prereqs: [BEG-045, BEG-056]}  # Added in v2.0: AI
  # BEG-P6 Git, SQL, and Web Foundations
  - {id: BEG-046, n: 46, phase: BEG-P6, status: detailed, title: Version control, topics: "Repository, commits, staging, branches, merges, conflicts, .gitignore", prereqs: [BEG-006]}
  - {id: BEG-047, n: 47, phase: BEG-P6, status: detailed, title: GitHub, topics: "Remote repositories, push/pull, pull requests, README, Markdown", prereqs: [BEG-046]}
  - {id: BEG-048, n: 48, phase: BEG-P6, status: detailed, title: Data fundamentals, topics: "Structured data, relational vs nonrelational databases, DBMS, schemas", prereqs: [BEG-002]}
  - {id: BEG-049, n: 49, phase: BEG-P6, status: detailed, title: Relational modeling, topics: "Tables, columns, rows, primary/foreign keys, relationships, normalization basics", prereqs: [BEG-048]}
  - {id: BEG-050, n: 50, phase: BEG-P6, status: detailed, title: SQL foundations, topics: "DDL, DML, SELECT, WHERE, ORDER BY, GROUP BY, HAVING, JOINs, subqueries", prereqs: [BEG-049]}
  - {id: BEG-051, n: 51, phase: BEG-P6, status: detailed, title: PostgreSQL basics, topics: "Installation, pgAdmin/DBeaver, schemas, constraints, CRUD, transactions introduction", prereqs: [BEG-005, BEG-050]}
  - {id: BEG-052, n: 52, phase: BEG-P6, status: detailed, title: Web fundamentals, topics: "HTTP methods, status codes, headers, JSON, URLs, query parameters, request body", prereqs: [BEG-003]}
  - {id: BEG-053, n: 53, phase: BEG-P6, status: detailed, title: API fundamentals, topics: "REST concepts, endpoint design, Postman, request/response examples", prereqs: [BEG-052]}
  - {id: BEG-054, n: 54, phase: BEG-P6, status: detailed, title: Build tools, topics: "Maven basics, pom.xml, dependencies, build lifecycle, running tests", prereqs: [BEG-006, BEG-045]}
  # Added in v1.0 dependency mapping: the Beginner capstone requires JDBC, which the roadmap only taught in JNR-025.
  - {id: BEG-055, n: null, phase: BEG-P6, status: detailed, title: JDBC essentials, topics: "Driver dependency, DriverManager, Connection, PreparedStatement, ResultSet, try-with-resources, SQL injection", prereqs: [BEG-029, BEG-051, BEG-054]}

  # ── LEVEL 2 — JUNIOR ───────────────────────────────────────────────────────
  # JNR-P1 Professional Java Development
  - {id: JNR-001, n: 55, phase: JNR-P1, status: detailed, title: Modern Java, topics: "Release cadence, LTS versions, records, sealed classes, switch expressions, text blocks, pattern matching", prereqs: [BEG-012, BEG-024, BEG-026]}
  - {id: JNR-002, n: 56, phase: JNR-P1, status: detailed, title: Maven in depth, topics: "Dependency scopes, transitive dependencies, BOMs, plugins, multi-module basics, reproducible builds", prereqs: [BEG-054]}
  - {id: JNR-003, n: 57, phase: JNR-P1, status: detailed, title: Code quality, topics: "Naming, cohesion, coupling, DRY, KISS, YAGNI, code smells", prereqs: [BEG-028]}
  - {id: JNR-055, n: null, phase: JNR-P1, status: detailed, title: AI-assisted development workflow, topics: "IDE assistants, context-rich prompts, generating tests and boilerplate, reviewing AI code in pull requests, protecting proprietary code, team policy", prereqs: [BEG-057, JNR-003]}  # Added in v2.0: AI
  - {id: JNR-004, n: 58, phase: JNR-P1, status: detailed, title: SOLID principles, topics: "SRP, OCP, LSP, ISP, DIP with practical Java examples", prereqs: [BEG-024, JNR-003]}
  - {id: JNR-005, n: 59, phase: JNR-P1, status: detailed, title: Design patterns introduction, topics: "Factory, Builder, Strategy, Adapter, Decorator, Observer, Repository", prereqs: [JNR-004]}
  - {id: JNR-006, n: 60, phase: JNR-P1, status: detailed, title: Logging, topics: "SLF4J, Logback, log levels, structured messages, avoiding sensitive data", prereqs: [BEG-029, JNR-002]}
  - {id: JNR-007, n: 61, phase: JNR-P1, status: detailed, title: Configuration, topics: "Properties, YAML, profiles, environment variables, externalized configuration", prereqs: [BEG-006, BEG-034]}
  # JNR-P2 Spring Framework Fundamentals
  - {id: JNR-008, n: 62, phase: JNR-P2, status: detailed, title: Spring ecosystem, topics: "Spring Framework vs Spring Boot vs Spring Data vs Spring Security", prereqs: [JNR-002]}
  - {id: JNR-009, n: 63, phase: JNR-P2, status: detailed, title: IoC and DI, topics: "Inversion of Control, dependency injection, constructor injection, bean lifecycle", prereqs: [JNR-004, JNR-008]}
  - {id: JNR-010, n: 64, phase: JNR-P2, status: detailed, title: Spring container, topics: "ApplicationContext, bean scopes, component scanning, stereotypes", prereqs: [JNR-009]}
  - {id: JNR-011, n: 65, phase: JNR-P2, status: detailed, title: Spring Boot, topics: "Starters, auto-configuration, project structure, embedded servers", prereqs: [JNR-010]}
  - {id: JNR-012, n: 66, phase: JNR-P2, status: detailed, title: Configuration management, topics: "application.yml, profiles, @ConfigurationProperties, validation", prereqs: [JNR-007, JNR-011]}
  - {id: JNR-013, n: 67, phase: JNR-P2, status: detailed, title: Layered architecture, topics: "Controller, service, repository, DTO, domain/entity models", prereqs: [BEG-027, JNR-011]}
